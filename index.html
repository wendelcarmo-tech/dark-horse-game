<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dark Horse: Corrida Presidencial</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #1a1a24;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            color: white;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            height: 400px;
            border: 4px solid #f39c12;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        canvas { background: linear-gradient(to bottom, #74b9ff, #dfe6e9); display: block; }
        
        .screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(26, 26, 36, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
        }
        .hud {
            position: absolute;
            top: 10px; left: 10px; right: 10px;
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 10;
        }
        .section-title { margin-top: 15px; margin-bottom: 5px; font-size: 14px; color: #f39c12; text-transform: uppercase; }
        .btn-group { display: flex; gap: 15px; margin-bottom: 15px; }
        .btn {
            border: none;
            color: white;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px rgba(0,0,0,0.3);
            user-select: none;
            transition: all 0.2s;
        }
        .btn:active { transform: translateY(2px); }
        .btn-selected { outline: 3px solid #fff; transform: scale(1.05); }
        
        .btn-lula { background: #e74c3c; }
        .btn-flavio { background: #3498db; }
        .btn-prender { background: #c0392b; }
        .btn-soltar { background: #27ae60; }
        .btn-start { background: #f39c12; margin-top: 15px; width: 200px; }
        .btn-jump { background: #f39c12; margin-top: 15px; width: 250px; }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- HUD -->
        <div class="hud">
            <span id="daysLeft" style="color: #f1c40f;">Dias p/ Eleição: 30s</span>
            <span id="playerScore" style="color: #2ecc71;">Você: 0</span>
            <span id="cpuScore" style="color: #e74c3c;">STF / IA: 0</span>
        </div>

        <!-- Tela de Seleção Inicial -->
        <div id="startScreen" class="screen">
            <h2>DARK HORSE: CORRIDA ELEITORAL</h2>
            
            <div class="section-title">1. Quem você quer perseguir?</div>
            <div class="btn-group">
                <button class="btn btn-lula btn-selected" id="targetLula" onclick="selectTarget('LULA')">LULA</button>
                <button class="btn btn-flavio" id="targetFlavio" onclick="selectTarget('FLÁVIO')">FLÁVIO</button>
            </div>

            <div class="section-title">2. Seu objetivo até a eleição:</div>
            <div class="btn-group">
                <button class="btn btn-prender btn-selected" id="goalPrender" onclick="selectGoal('PRENDER')">PRENDER</button>
                <button class="btn btn-soltar" id="goalSoltar" onclick="selectGoal('SOLTAR')">SOLTAR</button>
            </div>

            <button class="btn btn-start" onclick="startGame()">INICIAR JOGO</button>
        </div>

        <!-- Tela de Fim de Jogo -->
        <div id="endScreen" class="screen" style="display: none;">
            <h1 id="winnerText">CHEGOU O DIA DA ELEIÇÃO!</h1>
            <p id="finalScoreText" style="margin: 15px 0; font-size: 18px; white-space: pre-line;"></p>
            <button class="btn btn-soltar" onclick="resetGame()">Jogar Novamente</button>
        </div>

        <canvas id="gameCanvas" width="800" height="400"></canvas>
    </div>

    <button class="btn btn-jump" id="jumpBtn">PULAR (Toque / Espaço)</button>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let selectedTarget = 'LULA';
let selectedGoal = 'PRENDER';

let cpuGoal = 'SOLTAR';
let playerScore = 0;
let cpuScore = 0;
let daysLeft = 30;
let gameRunning = false;
let timerInterval;

const horse = { x: 150, y: 280, width: 60, height: 50, vy: 0, gravity: 0.8, jumpPower: -14, grounded: false };

// Candidatos no cenário
let targetCandidate = { name: 'LULA', x: 650, y: 290, width: 45, height: 60, color: '#e74c3c' };
let pusherCandidate = { name: 'FLÁVIO', x: 30, y: 290, width: 45, height: 60, color: '#3498db' };

let decrees = [];

function selectTarget(target) {
    selectedTarget = target;
    document.getElementById('targetLula').classList.toggle('btn-selected', target === 'LULA');
    document.getElementById('targetFlavio').classList.toggle('btn-selected', target === 'FLÁVIO');
}

function selectGoal(goal) {
    selectedGoal = goal;
    document.getElementById('goalPrender').classList.toggle('btn-selected', goal === 'PRENDER');
    document.getElementById('goalSoltar').classList.toggle('btn-selected', goal === 'SOLTAR');
}

function startGame() {
    cpuGoal = selectedGoal === 'PRENDER' ? 'SOLTAR' : 'PRENDER';
    
    // Define posições e cores com base na escolha
    if (selectedTarget === 'LULA') {
        targetCandidate = { name: 'LULA', x: 650, y: 290, width: 45, height: 60, color: '#e74c3c' };
        pusherCandidate = { name: 'FLÁVIO', x: 30, y: 290, width: 45, height: 60, color: '#3498db' };
    } else {
        targetCandidate = { name: 'FLÁVIO', x: 650, y: 290, width: 45, height: 60, color: '#3498db' };
        pusherCandidate = { name: 'LULA', x: 30, y: 290, width: 45, height: 60, color: '#e74c3c' };
    }

    document.getElementById('startScreen').style.display = 'none';
    playerScore = 0;
    cpuScore = 0;
    daysLeft = 30;
    gameRunning = true;
    decrees = [];

    updateHUD();

    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        if (gameRunning) {
            daysLeft--;
            updateHUD();
            if (daysLeft <= 0) endGame();
        }
    }, 1000);

    requestAnimationFrame(update);
}

function updateHUD() {
    document.getElementById('daysLeft').innerText = Dias p/ Eleição: ${daysLeft}s;
    document.getElementById('playerScore').innerText = Você (${selectedGoal}): ${playerScore};
    document.getElementById('cpuScore').innerText = Máquina (${cpuGoal}): ${cpuScore};
}

function spawnDecree() {
    const isPrender = Math.random() > 0.5;
    decrees.push({
        x: canvas.width,
        y: Math.random() > 0.5 ? 200 : 280,
        width: 75, height: 35,
        type: isPrender ? 'PRENDER' : 'SOLTAR',
        color: isPrender ? '#c0392b' : '#27ae60'
    });
}

setInterval(() => {
    if (gameRunning) spawnDecree();
}, 1700);

function update() {
    if (!gameRunning) return;

    horse.vy += horse.gravity;
    horse.y += horse.vy;

    if (horse.y >= 280) {
        horse.y = 280;
        horse.vy = 0;
        horse.grounded = true;
    }

    for (let i = 0; i < decrees.length; i++) {
        decrees[i].x -= 6.5;

        // Jogador pega o parecer com o Cavalo
        if (checkCollision(horse, decrees[i])) {
            if (decrees[i].type === selectedGoal) {
                playerScore++;
            } else {
                cpuScore++;
            }
            updateHUD();
            decrees.splice(i, 1);
            i--;
            continue;
        }

        // Se o parecer passar sem ser coletado, a Máquina pontua se for da meta dela
        if (decrees[i].x + decrees[i].width < 0) {
            if (decrees[i].type === cpuGoal) {
                cpuScore++;
                updateHUD();
            }
            decrees.splice(i, 1);
            i--;
        }
    }

    draw();
    requestAnimationFrame(update);
}

function checkCollision(a, b) {
    return a.x < b.x + b.width && a.x + a.width > b.x &&
           a.y < b.y + b.height && a.y + a.height > b.y;
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Chão
    ctx.fillStyle = '#27ae60';
    ctx.fillRect(0, 330, canvas.width, 70);

    // Candidato Empurrando (Atrás)
    ctx.fillStyle = pusherCandidate.color;
    ctx.fillRect(pusherCandidate.x, pusherCandidate.y, pusherCandidate.width, pusherCandidate.height);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px Arial';
    ctx.fillText(pusherCandidate.name, pusherCandidate.x - 2, pusherCandidate.y - 10);

    // Candidato Alvo (À frente)
    ctx.fillStyle = targetCandidate.color;
    ctx.fillRect(targetCandidate.x, targetCandidate.y, targetCandidate.width, targetCandidate.height);
    ctx.fillStyle = '#fff';
    ctx.fillText(targetCandidate.name, targetCandidate.x + 2, targetCandidate.y - 10);

    // Cavalo (Dark Horse)
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(horse.x, horse.y, horse.width, horse.height);
    ctx.fillStyle = '#f1c40f';
    ctx.fillText("Dark Horse", horse.x - 5, horse.y - 10);

    // Pareceres do STF
    decrees.forEach(d => {
        ctx.fillStyle = d.color;
        ctx.fillRect(d.x, d.y, d.width, d.height);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 11px Arial';
        ctx.fillText("STF: " + d.type, d.x + 6, d.y + 22);
    });
}

function endGame() {
    gameRunning = false;
    clearInterval(timerInterval);
    
    const endScreen = document.getElementById('endScreen');
    const winnerText = document.getElementById('winnerText');
    const finalScoreText = document.getElementById('finalScoreText');

    let targetText = selectedTarget;
    let actionText = selectedGoal === 'PRENDER' ? 'preso' : 'solto';

    if (playerScore > cpuScore) {
        winnerText.innerText = "VITÓRIA ELEITORAL!";
        winnerText.style.color = "#2ecc71";
        finalScoreText.innerText = Você conseguiu! ${targetText} foi ${actionText} antes da eleição.\n\nVocê: ${playerScore} | Máquina: ${cpuScore};
    } else if (cpuScore > playerScore) {
        winnerText.innerText = "DERROTA NAS URNAS!";
        winnerText.style.color = "#e74c3c";
        finalScoreText.innerText = A Máquina impediu que ${targetText} fosse ${actionText}.\n\nVocê: ${playerScore} | Máquina: ${cpuScore};
    } else {
        winnerText.innerText = "EMPATE TÉCNICO!";
        winnerText.style.color = "#f1c40f";
        finalScoreText.innerText = Placar Empatado! A decisão ficou para o 2º Turno.\n\nVocê: ${playerScore} | Máquina: ${cpuScore};
    }

    endScreen.style.display = 'flex';
}

function resetGame() {
    document.getElementById('endScreen').style.display = 'none';
    document.getElementById('startScreen').style.display = 'flex';
}

function jump() {
    if (horse.grounded && gameRunning) {
        horse.vy = horse.jumpPower;
        horse.grounded = false;
    }
}

document.getElementById('jumpBtn').addEventListener('click', jump);
window.addEventListener('touchstart', jump);
window.addEventListener('keydown', (e) => { if (e.code === 'Space') jump(); });
</script>
</body>
</html>
